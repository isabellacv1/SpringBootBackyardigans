<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Inicio de sesión</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div class="card" style="max-width:480px;">
    <span class="badge badge--title">Login</span>
    <h1>Iniciar sesión</h1>
    <p class="sub">Introduce tus credenciales para acceder a la aplicación.</p>

    <div th:if="${param.disabled}" class="flash-message flash-message--warning">
        Tu cuenta está pendiente de aprobación por un administrador.
    </div>

    <div th:if="${param.error}" class="flash-message flash-message--error">
        Usuario o contraseña incorrectos.
    </div>

    <form method="post" th:action="@{/auth/login}">
        <div class="field">
            <label for="username">Correo electrónico</label>
            <input id="username" type="text" class="control" name="username" placeholder="tu@correo.com" required>
        </div>

        <div class="field">
            <label for="password">Contraseña</label>
            <input id="password" type="password" class="control" name="password" placeholder="••••••••" required>
        </div>

        <div class="actions">
            <button type="submit" class="btn btn--primary">Entrar</button>
            <button type="reset" class="btn btn--ghost">Limpiar</button>
        </div>
    </form>

    <p class="sub" style="margin-top:20px;">
        ¿No tienes cuenta? <a th:href="@{/auth/signup}" style="color:var(--primary-400); text-decoration:none;">Regístrate aquí</a>
    </p>
</div>
</body>
</html>
