<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Asociar Rol a Usuario</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div class="card" style="max-width: 640px;">
    <div class="header-row">
        <span class="badge badge--title">Aprobar Usuario</span>
        <h1 th:text="'Asignar Rol a ' + ${user.name}">Asignar Rol a Usuario</h1>
    </div>
    <p class="sub">Selecciona uno o más roles para asignar al usuario. Al asignar un rol, el usuario será aprobado y podrá acceder a la aplicación.</p>

    <form method="post" th:action="@{/admin/user/{id}/roles/associate(id=${user.id})}">
        <div class="field">
            <label>Roles Disponibles</label>
            <div class="checkbox-group">
                <div th:each="role : ${allRoles}" class="checkbox-item">
                    <input type="checkbox" th:id="'role-' + ${role.id}" name="roleIds" th:value="${role.id}">
                    <label th:for="'role-' + ${role.id}" th:text="${role.name}"></label>
                </div>
            </div>
        </div>

        <div class="actions">
            <button type="submit" class="btn btn--primary">Guardar Roles</button>
            <a th:href="@{/admin/index}" class="btn btn--ghost">Cancelar</a>
        </div>
    </form>
</div>
</body>
</html>
